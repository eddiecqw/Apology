<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>給老婆的道歉信</title>
    <link rel="stylesheet" href="/src/style.css">
  </head>
  <body>
    <div id="app">
      
      <!-- 第一頁：開場 (Landing Page) -->
      <section id="page1" class="page active">
        <div class="content-wrapper">
          <!-- 替換為 SorryCat.jpg -->
          <img class="main-gif" src="/SorryCat.jpg" alt="道歉貓咪">
          <p class="subtitle">致我最愛的老婆...</p>
          <button id="startBtn" class="btn pulse-btn">Start</button>
        </div>
      </section>

      <!-- 第二頁：Windows 彈窗地獄 -->
      <section id="page2" class="page next-page">
        <div id="window-container"></div>
        
        <!-- 最終的選擇題 -->
        <div id="finalQuestion" class="os-window final-window hidden">
          <div class="os-header">
            <span>⚠️ 最終確認.exe</span>
          </div>
          <div class="os-body">
            <h3>老婆願意原諒我嗎？🥺</h3>
            <div class="button-group">
              <button id="btnYes" class="os-btn">是 ❤️</button>
              <!-- 這裡先改成「否」 -->
              <button id="btnNo" class="os-btn shaky-btn">否 😠</button>
            </div>
          </div>
        </div>
      </section>

      <!-- 第三頁：大結局 (大和解) -->
      <section id="page3" class="page next-page">
        <div class="content-wrapper">
          <!-- 替換為 kiss.jpg -->
          <img class="main-gif" src="/kiss.jpg" alt="親親">
          <h2>太好啦！！！🎉</h2>
          <p>我就知道老婆最好了！<br>不要不開心了，晚上帶你上分~！❤️</p>
        </div>
      </section>

    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
